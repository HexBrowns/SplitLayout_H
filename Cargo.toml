[package]
name = "split-layout-h"
version = "0.3.5"
edition = "2021"
license = "MIT"
authors = ["HexBrowns"]
description = "SplitLayout_H - 分離した本体のパネルを、自由に分割した枠へ並べる AviUtl2 プラグイン"
publish = false

[lib]
name = "split_layout_h"
crate-type = ["cdylib", "rlib"]  # rlib は tests/ の偽の本体のテストから呼ぶため

[dependencies]
aviutl2 = { version = "0.48", features = ["generic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
